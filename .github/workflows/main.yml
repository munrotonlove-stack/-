name: Android APK Auto Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d project
          else
            cp -R . project/
          fi
          DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-Khata-Debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
